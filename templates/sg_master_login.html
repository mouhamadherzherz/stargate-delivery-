<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stargate Master | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .bg-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.15), transparent 25%);
        }
    </style>
</head>
<body class="flex items-center justify-center relative">
    <div class="bg-particles"></div>

    <div class="glass-panel w-full max-w-md p-10 rounded-3xl relative z-10 animate-[pulse_3s_ease-in-out_infinite]">
        
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-gradient-to-tr from-indigo-500 to-purple-600 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg shadow-indigo-500/30 transform rotate-12 hover:rotate-0 transition-all duration-300">
                <i class="fa-solid fa-satellite-dish text-4xl text-white"></i>
            </div>
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">مركز القيادة المركزي</h1>
            <p class="text-slate-400 text-sm mt-2 tracking-widest font-mono text-xs uppercase">SaaS Operation Center V3.0</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="p-4 rounded-xl mb-6 text-sm font-bold flex items-center gap-2 {% if category == 'success' %}bg-emerald-500/20 text-emerald-400 border border-emerald-500/30{% else %}bg-rose-500/20 text-rose-400 border border-rose-500/30{% endif %}">
                        <i class="fa-solid {% if category == 'success' %}fa-check-circle{% else %}fa-circle-exclamation{% endif %}"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/sg_master/">
            <div class="mb-6">
                <label class="block text-slate-400 text-sm font-semibold mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-lock text-indigo-400"></i>
                    كلمة المرور الرئيسية (Master Key)
                </label>
                <input type="password" name="master_password" required autofocus
                       class="w-full bg-slate-900/50 border border-slate-700/50 rounded-xl px-4 py-4 text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition text-center tracking-[0.5em] font-mono text-xl"
                       placeholder="••••••••••••">
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-500/25 transition-all transform hover:-translate-y-1 active:scale-95 flex items-center justify-center gap-2">
                <i class="fa-solid fa-fingerprint"></i>
                مصادقة الدخول
            </button>
        </form>

        <div class="mt-8 text-center border-t border-slate-700/50 pt-6">
            <p class="text-slate-500 text-xs flex justify-center items-center gap-2">
                <i class="fa-solid fa-shield-halved"></i>
                مشفر بتقنية AES-256 و SHA-256
            </p>
        </div>
    </div>
</body>
</html>
