{% extends 'base.html' %}

{% block title %}تسجيل دخول المدير العام | {{ company_name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-xl text-center space-y-6">
        <div class="w-20 h-20 bg-amber-50 border-2 border-amber-200 text-amber-600 rounded-3xl flex items-center justify-center text-3xl mx-auto shadow-sm">
            👑
        </div>

        <div>
            <h2 class="text-2xl font-black text-slate-800">بوابة المدير العام</h2>
            <p class="text-xs text-slate-500 mt-1">الرجاء إدخال رمز المرور السري للمدير للوصول إلى لوحة التحكم الكاملة.</p>
        </div>

        <form method="POST" action="{{ url_for('unlock_admin') }}" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-2">كلمة مرور المدير السري (PIN)</label>
                <input type="password" name="pin" required placeholder="••••••••" autofocus class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-xl font-black tracking-widest text-center focus:ring-2 focus:ring-red-500 font-mono shadow-inner">
                <span class="text-[11px] text-slate-400 mt-1.5 block">أدخل الرمز السري الخاص بالمدير للوصول لكافة الصلاحيات</span>
            </div>

            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 px-6 rounded-2xl text-sm shadow-lg shadow-red-600/20 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-key"></i>
                <span>تسجيل الدخول كمدير عام</span>
            </button>
        </form>
    </div>
</div>
{% endblock %}
