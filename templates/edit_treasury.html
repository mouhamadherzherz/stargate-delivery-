{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 mt-6">
    <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-6">
        <h2 class="text-xl font-black text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-pen-to-square text-blue-600"></i> تعديل بيانات الخزينة
        </h2>
        <a href="{{ url_for('treasury_view') }}" class="text-xs font-bold text-slate-500 hover:text-slate-800 bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-xl transition">عودة للخزائن</a>
    </div>

    <form method="POST" action="{{ url_for('edit_vault', vault_id=vault.id) }}" class="space-y-5">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">اسم الخزينة/الصندوق *</label>
            <input type="text" name="name" value="{{ vault.name }}" required class="w-full border-slate-200 rounded-xl text-sm focus:ring-blue-500 focus:border-blue-500 bg-slate-50">
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">النوع *</label>
            <select name="type" required class="w-full border-slate-200 rounded-xl text-sm focus:ring-blue-500 focus:border-blue-500 bg-slate-50">
                <option value="cash" {% if vault.type == 'cash' %}selected{% endif %}>كاش نقدي</option>
                <option value="whish" {% if vault.type == 'whish' %}selected{% endif %}>محفظة Whish Money</option>
                <option value="wallet" {% if vault.type == 'wallet' %}selected{% endif %}>محفظة إلكترونية أخرى (OMT, إلخ)</option>
                <option value="bank" {% if vault.type == 'bank' %}selected{% endif %}>حساب بنكي</option>
            </select>
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">ملاحظات وصفية</label>
            <input type="text" name="notes" value="{{ vault.notes or '' }}" class="w-full border-slate-200 rounded-xl text-sm focus:ring-blue-500 focus:border-blue-500 bg-slate-50">
        </div>

        <div class="pt-2">
            <label class="flex items-center gap-2 text-xs font-bold text-slate-700 cursor-pointer">
                <input type="checkbox" name="adjust_balance" value="1" onchange="document.getElementById('balanceContainer').classList.toggle('hidden', !this.checked)" class="rounded text-blue-600 focus:ring-blue-500">
                <span>تعديل الرصيد يدوياً (تصحيح المحاسبة)</span>
            </label>
        </div>

        <div id="balanceContainer" class="hidden bg-slate-100 p-4 rounded-xl border border-slate-200">
            <label class="block text-xs font-bold text-slate-700 mb-1.5">الرصيد الفعلي الجديد (ل.ل)</label>
            <input type="number" name="balance" value="{{ vault.balance }}" class="w-full border-slate-300 rounded-xl text-sm font-mono text-left focus:ring-blue-500 focus:border-blue-500" dir="ltr">
            <p class="text-[10px] text-slate-500 mt-1">تنبيه: سيؤدي هذا لتغيير الرصيد دون تسجيل قيد محاسبي!</p>
        </div>

        <div class="pt-6 border-t border-slate-100 flex items-center justify-between gap-4">
            {% if vault.id != 1 %}
            <button type="button" onclick="if(confirm('هل أنت متأكد من الحذف؟ يجب أن يكون الرصيد صفراً.')) { document.getElementById('deleteForm').submit(); }" class="text-xs text-rose-600 hover:text-rose-800 font-bold px-3 py-2 rounded-xl hover:bg-rose-50 transition">
                <i class="fa-solid fa-trash-can"></i> حذف الخزينة
            </button>
            {% else %}
            <div></div>
            {% endif %}
            
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-black px-8 py-3 rounded-xl text-sm shadow-md shadow-blue-600/20 transition">حفظ التعديلات</button>
        </div>
    </form>

    {% if vault.id != 1 %}
    <form id="deleteForm" method="POST" action="{{ url_for('delete_vault', vault_id=vault.id) }}" class="hidden">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"></form>
    {% endif %}
</div>
{% endblock %}
